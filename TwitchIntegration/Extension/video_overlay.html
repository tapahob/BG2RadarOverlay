<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BG2 Radar Overlay</title>
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<style>
  /* The whole iframe covers the video; only the icon/panel themselves should catch
     clicks, everything else must stay click-through so viewers can still interact
     with the video/player controls underneath. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    pointer-events: none;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    color: #efeff1;
  }

  #icon {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(20, 16, 12, 0.85);
    border: 2px solid #c9a24b;
    cursor: pointer;
    pointer-events: auto;
    user-select: none;
    overflow: hidden;
  }

  /* The artwork is square and fills the circle, so the hover cue has to be on the image
     itself - a background colour behind it would never show. */
  #icon img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #icon:hover img { filter: brightness(1.3); }

  #panel {
    position: absolute;
    right: 16px;
    bottom: 64px;
    width: 280px;
    max-height: 380px;
    background: rgba(20, 16, 12, 0.92);
    border: 2px solid #c9a24b;
    border-radius: 8px;
    padding: 10px;
    pointer-events: auto;
    display: none;
    flex-direction: column;
  }
  #panel.open { display: flex; }

  /* min-height:0 is what actually makes this scroll: a flex item defaults to min-height:auto,
     which refuses to shrink below its content and would push the controls out of the panel
     instead of overflowing here. */
  #scrollArea {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }

  #scrollArea::-webkit-scrollbar { width: 6px; }
  #scrollArea::-webkit-scrollbar-track { background: transparent; }
  #scrollArea::-webkit-scrollbar-thumb {
    background: rgba(201, 162, 75, 0.45);
    border-radius: 3px;
  }
  #scrollArea::-webkit-scrollbar-thumb:hover { background: rgba(201, 162, 75, 0.7); }

  /* Pinned below the scroll area - the message box and Summon button must always be reachable
     without scrolling, however long the lists above get. */
  #actions {
    flex: 0 0 auto;
    padding-top: 10px;
    margin-top: 10px;
    border-top: 1px solid rgba(201, 162, 75, 0.35);
  }

  #panel h2 {
    font-size: 13px;
    margin: 0 0 8px;
    color: #c9a24b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .member {
    padding: 6px 0;
    border-top: 1px solid rgba(201, 162, 75, 0.25);
  }
  .member:first-of-type { border-top: none; }
  .member .name { font-weight: bold; font-size: 13px; }
  .member .meta { font-size: 11px; color: #d0c6a8; }
  .member .hp { font-size: 11px; color: #9be89b; }

  #empty, #offline {
    font-size: 12px;
    color: #d0c6a8;
    text-align: center;
    padding: 8px 0;
  }

  /* ---- Summon section ---- */

  #summon {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(201, 162, 75, 0.35);
  }

  #summonHeader {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  #summonHeader h2 { margin: 0; }
  #balance {
    font-size: 11px;
    color: #f0d488;
    font-weight: bold;
  }

  #shareIdentity {
    font-size: 11px;
    color: #d0c6a8;
    background: rgba(60, 48, 30, 0.6);
    border: 1px solid rgba(201, 162, 75, 0.45);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
  }
  #shareIdentityBtn {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 5px;
    border: 1px solid #c9a24b;
    border-radius: 4px;
    background: rgba(120, 95, 55, 0.85);
    color: #ffeec4;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
  }

  #buyTokens {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(201, 162, 75, 0.35);
  }
  #buyTokensNeed {
    font-size: 11px;
    color: #e8a0a0;
    margin-bottom: 6px;
  }
  #bitsProducts { display: flex; flex-wrap: wrap; gap: 6px; }
  .bitsProduct {
    flex: 1 1 auto;
    padding: 6px 8px;
    border: 1px solid #c9a24b;
    border-radius: 4px;
    background: rgba(120, 95, 55, 0.85);
    color: #ffeec4;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
  }
  .bitsProduct:hover { background: rgba(150, 120, 70, 0.95); }
  #pointsInstructions {
    font-size: 11px;
    color: #d0c6a8;
    margin-top: 6px;
  }

  /* Wraps rather than shrinking: the streamer decides how many packs exist, and four 60px
     tiles on one row would be unreadable in a 280px panel. */
  #packs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pack {
    flex: 0 0 calc(33.333% - 6px);
    box-sizing: border-box;
    background: rgba(60, 48, 30, 0.6);
    border: 2px solid rgba(201, 162, 75, 0.45);
    border-radius: 6px;
    padding: 6px 2px 4px;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .pack:hover { background: rgba(90, 72, 44, 0.75); }
  .pack.selected {
    border-color: #f0d488;
    background: rgba(120, 95, 55, 0.85);
  }

  /* Square tile: the padding-bottom trick keeps it square at any panel width. */
  .pack .glyph {
    font-size: 22px;
    line-height: 1;
    padding: 6px 0;
  }
  .pack .caption {
    font-size: 10px;
    color: #e8dcbb;
    margin-top: 2px;
    letter-spacing: 0.02em;
    overflow-wrap: anywhere;
  }
  .pack .band {
    font-size: 9px;
    color: #a99d80;
  }
  .pack .cost {
    font-size: 9px;
    color: #f0d488;
    font-weight: bold;
  }

  #total {
    font-size: 11px;
    color: #f0d488;
    font-weight: bold;
    text-align: right;
    margin-top: 8px;
    min-height: 13px;
  }

  /* Out-of-band packs are shown, not hidden: a viewer seeing "Lv 8-12" greyed out learns what
     the streamer has set up and what levelling unlocks. */
  .pack.unavailable {
    opacity: 0.4;
    cursor: default;
  }
  .pack.unavailable:hover { background: rgba(60, 48, 30, 0.6); }

  #packsEmpty {
    font-size: 11px;
    color: #d0c6a8;
    padding: 4px 0;
  }

  /* No top margin: #actions already supplies the gap below its separator. */
  #messageRow { margin-top: 0; }

  #message {
    width: 100%;
    box-sizing: border-box;
    background: rgba(20, 16, 12, 0.9);
    border: 1px solid rgba(201, 162, 75, 0.5);
    border-radius: 4px;
    color: #efeff1;
    font-family: inherit;
    font-size: 12px;
    padding: 6px 8px;
  }
  #message:focus { outline: none; border-color: #f0d488; }

  #messageMeta {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #a99d80;
    margin-top: 3px;
  }

  #send {
    width: 100%;
    margin-top: 8px;
    padding: 7px;
    border: 2px solid #c9a24b;
    border-radius: 5px;
    background: rgba(120, 95, 55, 0.85);
    color: #ffeec4;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  #send:hover:enabled { background: rgba(150, 120, 70, 0.95); }
  #send:disabled { opacity: 0.45; cursor: default; }

  #sendResult {
    font-size: 11px;
    color: #d0c6a8;
    margin-top: 6px;
    min-height: 13px;
  }
</style>
</head>
<body>
  <!-- Bundled next to this file rather than linked out of the repo's icons/ folder: only the
       Extension/ directory is uploaded to Twitch, so a path outside it would 404 there. -->
  <div id="icon" title="Party status"><img src="icon.png" alt="Party status"></div>
  <div id="panel">
    <!-- Everything that can grow without bound - a six-strong party, however many packs the
         streamer defined - scrolls. The controls below stay put, so the Summon button never
         drifts off the bottom of the panel and out of reach. -->
    <div id="scrollArea">
      <h2>Party</h2>
      <div id="content"><div id="offline">Waiting for stream data&hellip;</div></div>

      <div id="summon">
        <div id="summonHeader">
          <h2>Summon</h2>
          <div id="balance"></div>
        </div>

        <!-- Shown instead of the packs until the viewer shares identity - tokens are tracked
             per Twitch account, and there's no way to track or spend a balance for someone who
             hasn't. -->
        <div id="shareIdentity" hidden>
          Share your identity to buy and spend summon tokens.
          <button id="shareIdentityBtn">Share Identity</button>
        </div>

        <div id="packs"></div>

        <!-- Only appears once packs are picked and the balance doesn't cover them yet. -->
        <div id="buyTokens" hidden>
          <div id="buyTokensNeed"></div>
          <div id="bitsProducts"></div>
          <div id="pointsInstructions"></div>
        </div>
      </div>
    </div>

    <div id="actions">
      <div id="messageRow">
        <input id="message" type="text" maxlength="80" autocomplete="off"
               placeholder="Say something to the streamer&hellip;">
        <div id="messageMeta">
          <span>Shown in game</span>
          <span id="counter">0/80</span>
        </div>
      </div>

      <div id="total"></div>
      <button id="send" disabled>Pick a pack</button>
      <div id="sendResult"></div>
    </div>
  </div>

<script src="video_overlay.js"></script>
</body>
</html>
